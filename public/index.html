<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso - HOMM Codex</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <h1>HOMM Codex</h1>
        <p class="auth-subtitle">Entra con usuario y contraseña para jugar.</p>

        <form id="loginForm" class="auth-form">
          <h2>Login</h2>
          <label>
            Usuario
            <input id="loginUsername" name="username" type="text" minlength="3" required />
          </label>
          <label>
            Password
            <input id="loginPassword" name="password" type="password" minlength="4" required />
          </label>
          <button type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="auth-form">
          <h2>Registro</h2>
          <label>
            Usuario
            <input id="registerUsername" name="username" type="text" minlength="3" required />
          </label>
          <label>
            Password
            <input id="registerPassword" name="password" type="password" minlength="4" required />
          </label>
          <button type="submit">Crear cuenta</button>
        </form>

        <p id="authMessage" class="auth-message" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
